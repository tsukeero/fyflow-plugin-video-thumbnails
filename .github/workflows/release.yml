# Releases the Plugin for the official fyflow Plugin repository on a tag `<id>@<version>`
# (fyflow-ext.video-thumbnail@0.2.0): fyflow-plugins' reusable workflow builds it (`fyflow.build` in package.json,
# `pnpm plugin-folder`), packs `fyflow.pack` (dist/video-thumbnail) and makes a GitHub Release with the tarball. With no
# FYFLOW_PLUGINS_TOKEN secret it stops there: the README says how the PR is opened.
name: Release
on:
  push:
    tags: ["*@*"] # <id>@<version>
jobs:
  release:
    permissions:
      contents: write # the GitHub Release
    uses: fyflow/fyflow-plugins/.github/workflows/release-plugin.yml@v1
    secrets:
      FYFLOW_PLUGINS_TOKEN: ${{ secrets.FYFLOW_PLUGINS_TOKEN }}
